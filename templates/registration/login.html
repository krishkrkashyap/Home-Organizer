<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Home Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A3C34;
            --primary-light: #2D5A4E;
            --accent: #C4956A;
            --accent-light: #DDBF9E;
            --cream: #F8F3EC;
            --surface: #FFFFFF;
            --text: #1D1B1A;
            --text-muted: #7A726A;
            --error: #C0392B;
            --shadow: 0 20px 60px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            display: flex;
            max-width: 900px;
            width: 100%;
            background: var(--surface);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: fadeUp 0.6s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-brand {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 60px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .login-brand::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .login-brand h1 {
            font-family: 'Prata', serif;
            font-size: 2.2rem;
            margin-bottom: 12px;
            position: relative;
        }
        .login-brand p {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.6;
            position: relative;
        }
        .login-brand .icon {
            font-size: 3rem;
            margin-bottom: 20px;
            position: relative;
        }
        .login-form {
            padding: 60px 48px;
            flex: 1;
        }
        .login-form h2 {
            font-family: 'Prata', serif;
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 8px;
        }
        .login-form .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8E2DA;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s;
            background: var(--cream);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--accent);
            background: white;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-login:hover {
            background: var(--primary-light);
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .error-message {
            background: #FEF2F2;
            color: var(--error);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid #FECACA;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        @media (max-width: 700px) {
            .login-container { flex-direction: column; }
            .login-brand { padding: 40px 30px; }
            .login-form { padding: 40px 30px; }
            .login-brand h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-brand">
            <div class="icon">🏡</div>
            <h1>Home Organizer</h1>
            <p>Manage staff, kitchen, tasks, and reminders — all in one place. Your home, organized.</p>
        </div>
        <div class="login-form">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your dashboard</p>
            {% if form.errors %}
            <div class="error-message">
                Invalid username or password. Please try again.
            </div>
            {% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-login">Sign In</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
            <p class="footer-text">Admin: admin / admin123</p>
        </div>
    </div>
</body>
</html>
