<div class="form-group">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <small class="text-muted">{{ field.help_text }}</small>
    {% endif %}
    {% if field.errors %}
        <div class="field-error">{{ field.errors }}</div>
    {% endif %}
</div>
