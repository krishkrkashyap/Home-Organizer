{% extends 'base.html' %}
{% block title %}Mark Leave{% endblock %}
{% block content %}
<h1>Mark Leave — {{ staff.name }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'staff:detail' staff.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
