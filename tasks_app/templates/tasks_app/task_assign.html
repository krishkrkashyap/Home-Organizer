{% extends 'base.html' %}
{% block title %}Assign Task{% endblock %}
{% block content %}
<h1>Assign Task</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Assign</button>
    <a href="{% url 'tasks_app:task_dashboard' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
